<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Экзамен Syncpoly</title>
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --border: #e2e5ea;
  --text: #1a1d23;
  --text2: #5a6170;
  --accent: #4f6ef7;
  --correct: #1a9e5c;
  --correct-bg: #eafaf3;
  --correct-border: #6edba8;
  --wrong: #d63a3a;
  --wrong-bg: #fdf0f0;
  --wrong-border: #f09090;
  --selected: #eef1fe;
  --selected-border: #4f6ef7;
  --progress-bg: #e2e5ea;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a;
    --surface: #1e2028;
    --surface2: #252830;
    --border: #2e3140;
    --text: #e8eaf0;
    --text2: #8890a4;
    --accent: #6b85f8;
    --correct: #2dbb72;
    --correct-bg: #0d2a1e;
    --correct-border: #2dbb72;
    --wrong: #e05555;
    --wrong-bg: #2a1010;
    --wrong-border: #e05555;
    --selected: #1c2240;
    --selected-border: #6b85f8;
    --progress-bg: #2e3140;
    --shadow: 0 2px 16px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  --bg: #12141a;
  --surface: #1e2028;
  --surface2: #252830;
  --border: #2e3140;
  --text: #e8eaf0;
  --text2: #8890a4;
  --accent: #6b85f8;
  --correct: #2dbb72;
  --correct-bg: #0d2a1e;
  --correct-border: #2dbb72;
  --wrong: #e05555;
  --wrong-bg: #2a1010;
  --wrong-border: #e05555;
  --selected: #1c2240;
  --selected-border: #6b85f8;
  --progress-bg: #2e3140;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 48px;
}
.header {
  width: 100%; max-width: 720px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px;
}
.logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.score-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 14px;
  font-size: 13px; font-weight: 600; color: var(--text2);
  box-shadow: var(--shadow);
}
.score-pill span { color: var(--accent); }
.theme-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; cursor: pointer;
  font-size: 15px; color: var(--text2); box-shadow: var(--shadow);
}
.theme-btn:hover { border-color: var(--accent); }
.progress-wrap {
  width: 100%; max-width: 720px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.progress-bar {
  flex: 1; height: 6px; background: var(--progress-bg);
  border-radius: 99px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 99px; transition: width 0.3s ease;
}
.progress-label { font-size: 12px; color: var(--text2); white-space: nowrap; min-width: 56px; text-align: right; }
.filters {
  width: 100%; max-width: 720px;
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 20px; align-items: center;
}
.filter-label { font-size: 12px; color: var(--text2); font-weight: 500; margin-right: 2px; }
.filter-chip {
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 12px; color: var(--text2); cursor: pointer;
  transition: all 0.15s; font-weight: 500;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.shuffle-btn {
  margin-left: auto; padding: 5px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 12px; color: var(--text2); cursor: pointer; font-weight: 500; transition: all 0.15s;
}
.shuffle-btn:hover { border-color: var(--accent); color: var(--accent); }
.card {
  width: 100%; max-width: 720px;
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  padding: 28px 28px 24px; margin-bottom: 16px;
}
.attempt-tag {
  font-size: 11px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px;
}
.question-text {
  font-size: 17px; font-weight: 500; line-height: 1.55;
  color: var(--text); margin-bottom: 22px; text-wrap: balance;
}
.multi-hint { font-size: 12px; color: var(--accent); font-weight: 500; margin-bottom: 14px; margin-top: -10px; }
.options { display: flex; flex-direction: column; gap: 9px; }
.option {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 16px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--surface2);
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  user-select: none; -webkit-user-select: none;
}
.option:hover:not(.disabled) { border-color: var(--accent); background: var(--selected); }
.option.selected { border-color: var(--selected-border); background: var(--selected); }
.option.correct { border-color: var(--correct-border); background: var(--correct-bg); }
.option.wrong { border-color: var(--wrong-border); background: var(--wrong-bg); }
.option.disabled { cursor: default; }
.option-letter {
  min-width: 24px; height: 24px; border-radius: 6px;
  background: var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text2);
  flex-shrink: 0; margin-top: 1px; transition: background 0.15s, color 0.15s;
}
.option.selected .option-letter { background: var(--accent); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.wrong .option-letter { background: var(--wrong); color: #fff; }
.option-text { font-size: 15px; line-height: 1.5; color: var(--text); flex: 1; }
.option-icon { font-size: 15px; margin-left: auto; flex-shrink: 0; align-self: center; }
.actions { width: 100%; max-width: 720px; display: flex; gap: 10px; margin-top: 4px; }
.btn {
  flex: 1; padding: 13px; border-radius: 10px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--surface); color: var(--text2); border: 1.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.result-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
}
.result-card {
  background: var(--surface); border-radius: 20px; padding: 36px 32px;
  max-width: 400px; width: 100%; text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.result-emoji { font-size: 52px; margin-bottom: 12px; }
.result-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.result-sub { font-size: 15px; color: var(--text2); margin-bottom: 24px; }
.result-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; }
.stat-box { flex: 1; background: var(--surface2); border-radius: 10px; padding: 14px 10px; border: 1px solid var(--border); }
.stat-num { font-size: 26px; font-weight: 700; }
.stat-num.green { color: var(--correct); }
.stat-num.red { color: var(--wrong); }
.stat-label { font-size: 12px; color: var(--text2); margin-top: 2px; }
.result-btn {
  width: 100%; padding: 14px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
}
.result-btn:hover { opacity: 0.88; }
@media (max-width: 480px) {
  .card { padding: 20px 16px 18px; }
  .question-text { font-size: 15px; }
  .option-text { font-size: 14px; }
  .actions { flex-direction: column; }
}

</style>
</head>
<body>
<div class="header">
  <div class="logo">📚 Экзамен</div>
  <div class="header-right">
    <div class="score-pill">Счёт: <span id="scoreDisplay">0</span></div>
    <button class="theme-btn" onclick="toggleTheme()" title="Сменить тему">🌓</button>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">0 / 0</div>
</div>

<div class="filters" id="filters">
  <span class="filter-label">Попытка:</span>
</div>

<div class="card" id="qCard">
  <div class="attempt-tag" id="attemptTag"></div>
  <div class="question-text" id="questionText"></div>
  <div class="multi-hint" id="multiHint" style="display:none">Несколько правильных ответов — выберите все, затем нажмите Проверить</div>
  <div class="options" id="optionsList"></div>
  <button class="btn btn-primary confirm-btn" id="confirmBtn" onclick="confirmMulti()" style="display:none; margin-top:16px; width:100%">Проверить</button>
</div>

<div class="result-overlay" id="resultOverlay" style="display:none">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">Раунд завершён!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-stats">
      <div class="stat-box">
        <div class="stat-num green" id="statCorrect">0</div>
        <div class="stat-label">Правильно</div>
      </div>
      <div class="stat-box">
        <div class="stat-num red" id="statWrong">0</div>
        <div class="stat-label">Неправильно</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statPct" style="color:var(--accent)">0%</div>
        <div class="stat-label">Результат</div>
      </div>
    </div>
    <button class="result-btn" onclick="restartQuiz()">Начать заново</button>
  </div>
</div>

let filtered = [];
let queue = [];
let current = null;
let score = 0;
let answered = 0;
let wrongCount = 0;
let selected = new Set();
let revealed = false;
let activeFilter = 'all';

function init() {
  buildFilters();
  applyFilter('all');
}

function buildFilters() {
  var div = document.getElementById('filters');
  var attempts = [];
  ALL_QUESTIONS.forEach(function(q) {
    if (attempts.indexOf(q.attempt) === -1) attempts.push(q.attempt);
  });

  var allChip = makeChip('Все', 'all');
  allChip.classList.add('active');
  div.appendChild(allChip);

  attempts.forEach(function(a) { div.appendChild(makeChip(a, a)); });

  var shuffle = document.createElement('button');
  shuffle.className = 'shuffle-btn';
  shuffle.textContent = '🔀 Перемешать';
  shuffle.onclick = function() { shuffleArray(queue); loadQuestion(); };
  div.appendChild(shuffle);
}

function makeChip(label, value) {
  var c = document.createElement('button');
  c.className = 'filter-chip';
  c.textContent = label;
  c.dataset.value = value;
  c.onclick = function() { applyFilter(value); };
  return c;
}

function applyFilter(value) {
  activeFilter = value;
  document.querySelectorAll('.filter-chip').forEach(function(c) {
    c.classList.toggle('active', c.dataset.value === value);
  });
  filtered = value === 'all'
    ? ALL_QUESTIONS.slice()
    : ALL_QUESTIONS.filter(function(q) { return q.attempt === value; });
  queue = filtered.slice();
  shuffleArray(queue);
  score = 0; answered = 0; wrongCount = 0;
  updateScore();
  loadQuestion();
}

function shuffleArray(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

function loadQuestion() {
  if (queue.length === 0) { showResult(); return; }
  current = queue.shift();
  selected.clear();
  revealed = false;

  document.getElementById('attemptTag').textContent = current.attempt;
  document.getElementById('questionText').textContent = current.question;

  var isMulti = current.correct.length > 1;
  document.getElementById('multiHint').style.display = isMulti ? 'block' : 'none';

  // Show confirm button only for multi-answer questions
  var confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.style.display = isMulti ? 'block' : 'none';
  confirmBtn.disabled = true;
  confirmBtn.textContent = 'Проверить';

  var list = document.getElementById('optionsList');
  list.innerHTML = '';
  current.options.forEach(function(opt) {
    var el = document.createElement('div');
    el.className = 'option';
    el.dataset.letter = opt.letter;

    var letterEl = document.createElement('div');
    letterEl.className = 'option-letter';
    letterEl.textContent = opt.letter;

    var textEl = document.createElement('div');
    textEl.className = 'option-text';
    textEl.textContent = opt.text;

    var iconEl = document.createElement('div');
    iconEl.className = 'option-icon';

    el.appendChild(letterEl);
    el.appendChild(textEl);
    el.appendChild(iconEl);

    el.addEventListener('click', function() { handleOptionClick(el, opt.letter, isMulti); });
    list.appendChild(el);
  });

  updateProgress();
}

function handleOptionClick(el, letter, isMulti) {
  if (revealed) {
    // After reveal, clicking anywhere goes to next question
    loadQuestion();
    return;
  }

  if (isMulti) {
    // Toggle selection, wait for confirm button
    if (selected.has(letter)) {
      selected.delete(letter);
      el.classList.remove('selected');
    } else {
      selected.add(letter);
      el.classList.add('selected');
    }
    document.getElementById('confirmBtn').disabled = selected.size === 0;
  } else {
    // Single answer: select and reveal immediately
    selected.add(letter);
    el.classList.add('selected');
    revealAnswer();
  }
}

function confirmMulti() {
  if (!revealed && selected.size > 0) {
    revealAnswer();
    document.getElementById('confirmBtn').textContent = 'Следующий →';
    document.getElementById('confirmBtn').disabled = false;
  } else if (revealed) {
    loadQuestion();
  }
}

function revealAnswer() {
  revealed = true;
  answered++;

  var correct = new Set(current.correct);
  var isCorrect = setsEqual(selected, correct);

  document.querySelectorAll('.option').forEach(function(el) {
    var letter = el.dataset.letter;
    el.classList.add('disabled');
    var icon = el.querySelector('.option-icon');
    if (correct.has(letter)) {
      el.classList.add('correct');
      icon.textContent = '✓';
    } else if (selected.has(letter)) {
      el.classList.add('wrong');
      icon.textContent = '✗';
    }
  });

  if (isCorrect) { score++; } else { wrongCount++; }
  updateScore();
  updateProgress();
}

function setsEqual(a, b) {
  if (a.size !== b.size) return false;
  var ok = true;
  a.forEach(function(x) { if (!b.has(x)) ok = false; });
  return ok;
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = score;
}

function updateProgress() {
  var total = filtered.length;
  var pct = total ? Math.round(answered / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = answered + ' / ' + total;
}

function showResult() {
  var pct = answered ? Math.round(score / answered * 100) : 0;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('resultEmoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
  document.getElementById('resultTitle').textContent = pct >= 80 ? 'Отлично!' : pct >= 50 ? 'Неплохо!' : 'Нужно повторить';
  document.getElementById('resultSub').textContent = 'Вы ответили на ' + answered + ' вопросов из ' + filtered.length;
  document.getElementById('resultOverlay').style.display = 'flex';
}

function restartQuiz() {
  document.getElementById('resultOverlay').style.display = 'none';
  applyFilter(activeFilter);
}

function toggleTheme() {
  var root = document.documentElement;
  var cur = root.getAttribute('data-theme');
  root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

init();

window.addEventListener('DOMContentLoaded', init);
</script>
